<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
</head>
<body>
    <h1>ToDo List</h1>
    
    <ul>
        {% for task in todos %}
        {% if task.done == False %}
            <li>{{ task.task }}</li>
        {% endif %}
        {% endfor %}
    </ul>
</body>
</html>
